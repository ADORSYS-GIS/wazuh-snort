name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/secret-scan.yml@db2f1dbe7eb5efbcb06aa80ad3719fc1675c37bf
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
    secrets:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
